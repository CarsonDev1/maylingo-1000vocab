<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Document -->
  <rect x="3" y="3" width="18" height="23" rx="2.5" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <!-- Ruled lines -->
  <line x1="7" y1="10" x2="17" y2="10" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="7" y1="14" x2="17" y2="14" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="7" y1="18" x2="13" y2="18" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pencil body -->
  <rect x="18.5" y="8" width="5" height="14" rx="1.2" transform="rotate(45 18.5 8)" fill="#4ade80" stroke="#16a34a" stroke-width="1.2"/>
  <!-- Pencil tip -->
  <polygon points="24.2,24.2 26.5,29 29,26.5" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <!-- Pencil eraser end -->
  <rect x="16" y="5.5" width="5" height="3" rx="0.8" transform="rotate(45 16 5.5)" fill="#fca5a5" stroke="#ef4444" stroke-width="0.8"/>
</svg>
