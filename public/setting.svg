<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ecbff"/>
      <stop offset="100%" stop-color="#1f7cff"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd84d"/>
      <stop offset="100%" stop-color="#ffb100"/>
    </linearGradient>
  </defs>

  <!-- Gear -->
  <g transform="translate(60,70)">
    <circle cx="150" cy="170" r="95" fill="#eef4ff" stroke="#8db7ff" stroke-width="10"/>
    <circle cx="150" cy="170" r="55" fill="url(#blue)"/>

    <g fill="#eef4ff" stroke="#8db7ff" stroke-width="10">
      <rect x="135" y="20" width="30" height="50" rx="8"/>
      <rect x="135" y="270" width="30" height="50" rx="8"/>
      <rect x="20" y="155" width="50" height="30" rx="8"/>
      <rect x="230" y="155" width="50" height="30" rx="8"/>

      <rect x="54" y="54" width="40" height="30" rx="8" transform="rotate(-45 74 69)"/>
      <rect x="206" y="256" width="40" height="30" rx="8" transform="rotate(-45 226 271)"/>

      <rect x="206" y="54" width="40" height="30" rx="8" transform="rotate(45 226 69)"/>
      <rect x="54" y="256" width="40" height="30" rx="8" transform="rotate(45 74 271)"/>
    </g>
  </g>

  <!-- Settings panel -->
  <g transform="translate(180,220)">
    <rect x="0" y="0" width="260" height="150" rx="24" fill="#f7faff" stroke="#b8cbff" stroke-width="8"/>
    <rect x="40" y="40" width="160" height="18" rx="9" fill="url(#blue)"/>
    <circle cx="190" cy="49" r="22" fill="url(#blue)"/>

    <rect x="40" y="95" width="160" height="18" rx="9" fill="url(#yellow)"/>
    <circle cx="140" cy="104" r="22" fill="url(#yellow)"/>
  </g>
</svg>