<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cover" x1="80" y1="80" x2="360" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bff4ff"/>
      <stop offset="100%" stop-color="#36a7ff"/>
    </linearGradient>
    <linearGradient id="blueEdge" x1="120" y1="100" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#39c6ff"/>
      <stop offset="100%" stop-color="#0067df"/>
    </linearGradient>
    <linearGradient id="star" x1="190" y1="145" x2="320" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe86a"/>
      <stop offset="100%" stop-color="#ffb400"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9b4a"/>
      <stop offset="100%" stop-color="#ff4a2f"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0a4f9e" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)" transform="rotate(-7 256 256)">
    <!-- back pages -->
    <rect x="142" y="112" width="245" height="315" rx="26" fill="#0b73e8"/>
    <rect x="125" y="105" width="245" height="315" rx="26" fill="#f7fbff" stroke="#1d82f0" stroke-width="10"/>
    <path d="M337 124h22c12 0 22 10 22 22v240c0 12-10 22-22 22h-22z" fill="#dfeaf8"/>
    <path d="M340 150h28M340 185h28M340 220h28M340 255h28M340 290h28M340 325h28M340 360h28"
          stroke="#b7c7dc" stroke-width="4" stroke-linecap="round"/>

    <!-- notebook cover -->
    <rect x="92" y="80" width="255" height="325" rx="28" fill="url(#blueEdge)"/>
    <rect x="103" y="88" width="232" height="302" rx="24" fill="url(#cover)" stroke="#d9fbff" stroke-width="6"/>

    <!-- spiral holes -->
    <g fill="#ffffff" opacity="0.92">
      <circle cx="135" cy="88" r="17"/>
      <circle cx="181" cy="88" r="17"/>
      <circle cx="227" cy="88" r="17"/>
      <circle cx="273" cy="88" r="17"/>
      <circle cx="319" cy="88" r="17"/>
    </g>

    <!-- spiral rings -->
    <g fill="none" stroke-width="16" stroke-linecap="round">
      <path d="M135 58c24 0 24 58 0 58" stroke="#ffbd24"/>
      <path d="M181 58c24 0 24 58 0 58" stroke="#ff7138"/>
      <path d="M227 58c24 0 24 58 0 58" stroke="#27b5ff"/>
      <path d="M273 58c24 0 24 58 0 58" stroke="#0d84f5"/>
      <path d="M319 58c24 0 24 58 0 58" stroke="#32b8ff"/>
    </g>

    <!-- star badge -->
    <path d="M235 158l26 53 58 8-42 41 10 58-52-27-52 27 10-58-42-41 58-8z"
          fill="url(#star)" stroke="#ff8b00" stroke-width="8" stroke-linejoin="round"/>
    <path d="M210 182l-13 34-34 8 29 20-2 35 28-22 33 12-12-33 22-28-35 1z"
          fill="#fff9a8" opacity="0.28"/>

    <!-- bookmark -->
    <path d="M139 394v67l25-18 26 18v-67z" fill="url(#orange)" stroke="#e83b2c" stroke-width="6" stroke-linejoin="round"/>

    <!-- side clasp -->
    <rect x="326" y="250" width="62" height="64" rx="18" fill="url(#blueEdge)" stroke="#025fc9" stroke-width="6"/>
    <rect x="377" y="194" width="23" height="56" rx="10" fill="#ffc83b" stroke="#ff9b00" stroke-width="5"/>

    <!-- highlights -->
    <path d="M128 128c18-18 52-23 91-21" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
    <path d="M292 115c18 0 30 9 35 24" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>